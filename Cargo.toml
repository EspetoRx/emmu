[workspace]
members = [
    "crates/emmu-core",
    "crates/emmu-nes",
    "crates/emmu-snes",
    "crates/emmu-frontend",
    "crates/emmu-mesen-sys",
    "platforms/desktop",
    "platforms/web",
    # "platforms/mobile", (você pode ativar depois)
]
# `emmu-super-sabicom` é um submodule usado apenas como dependência normal do
# `emmu-snes`. Mantê-lo fora do workspace evita que o Cargo (e o rust-analyzer)
# compile os dev-dependencies dele — em especial `compress-tools`, cujo build
# script exige a biblioteca nativa `libarchive` (que não é necessária em runtime).
exclude = ["crates/tetanes-core", "crates/emmu-super-sabicom"]
resolver = "2"

[patch.crates-io]
tetanes-core = { path = "crates/tetanes-core" }